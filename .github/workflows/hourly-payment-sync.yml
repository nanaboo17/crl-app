name: Hourly payment sync

# BigQuery access for CRL must run under the authorized IOH human identity.
# The previous GitHub runner expected GCP_SERVICE_ACCOUNT_JSON, but the IOH
# BigQuery environment does not permit this service-account/non-human access.
# Hourly payment synchronization is therefore handled by the authorized
# Google Apps Script trigger instead of GitHub Actions.
#
# Keep this workflow available for manual diagnostics without scheduling a
# job that is guaranteed to fail because no service-account secret exists.
on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Payment sync location
        run: |
          echo "Hourly CRL payment sync runs through the authorized Google Apps Script trigger."
          echo "GitHub BigQuery service-account sync is intentionally disabled."
